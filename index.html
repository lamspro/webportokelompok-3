<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portfolio Tim — Kelompok 3</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Caveat:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="head">
    <h1 id="judul"></h1>
    <p id="subjudul"></p>
  </header>

  <main>
    <!-- Piramid dibuat otomatis oleh js/app.js -->
    <div class="pyramid" id="pyramid" aria-label="Piramid anggota tim"></div>
    <p class="hint">Klik foto untuk melihat profil anggota</p>
  </main>

  <!-- Modal detail anggota -->
  <div class="modal" id="modal" aria-hidden="true">
    <div class="modal__backdrop" data-close></div>
    <article class="modal__card" role="dialog" aria-modal="true" aria-labelledby="m-nama">
      <button class="modal__close" data-close aria-label="Tutup">×</button>
      <img class="modal__foto" id="m-foto" alt="">
      <div class="modal__body">
        <h2 id="m-nama"></h2>
        <p class="modal__peran" id="m-peran"></p>
        <p id="m-deskripsi"></p>
        <ul class="tags" id="m-skill"></ul>
        <p class="modal__kontak" id="m-kontak"></p>
        <div class="modal__nav">
          <button id="prev">‹ Sebelumnya</button>
          <button id="next">Berikutnya ›</button>
        </div>
      </div>
    </article>
  </div>

  <script src="js/members.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
